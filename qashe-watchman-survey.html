<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Satisfaction Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#B21616; --red-dark:#7E0F0F; --red-tint:#FCEAEA;
    --bg:#F7F6F5; --panel:#FFFFFF; --border:#E3E1DF;
    --text:#1E1C1B; --text-dim:#615C59; --text-faint:#9C9895;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:40px 20px;}
  button{font-family:inherit; cursor:pointer;}
  textarea{font-family:'Inter',sans-serif;}

  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:36px; width:100%; max-width:560px;}
  .brand-row{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .brand-row img{max-height:34px; max-width:150px; object-fit:contain;}
  .brand-row .fallback{font-family:'Poppins'; font-weight:700; font-size:17px;}

  h1{font-family:'Poppins'; font-weight:700; font-size:22px; margin-bottom:8px;}
  p.sub{font-size:13.5px; color:var(--text-dim); line-height:1.55; margin-bottom:28px;}

  .question{margin-bottom:26px;}
  .question .q-text{font-size:14px; font-weight:600; margin-bottom:12px;}
  .rating-row{display:flex; gap:8px; flex-wrap:wrap;}
  .rating-btn{
    flex:1; min-width:78px; border:1.5px solid var(--border); border-radius:8px; background:#fff;
    padding:12px 6px; text-align:center; transition:all .15s ease;
  }
  .rating-btn .num{font-family:'Poppins'; font-weight:700; font-size:17px; display:block;}
  .rating-btn .label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin-top:3px; display:block;}
  .rating-btn:hover{border-color:var(--red);}
  .rating-btn.selected{border-color:var(--red); background:var(--red-tint);}
  .rating-btn.selected .num{color:var(--red);}

  .field{margin-top:8px; margin-bottom:24px;}
  .field label{font-size:13.5px; font-weight:600; display:block; margin-bottom:8px;}
  .field textarea{width:100%; border:1.5px solid var(--border); border-radius:8px; padding:12px; font-size:13.5px; min-height:100px; resize:vertical;}
  .field textarea:focus{outline:none; border-color:var(--red);}
  .field .hint{font-size:12px; color:var(--text-faint); margin-top:6px;}

  .btn-submit{width:100%; background:var(--red); color:#fff; font-weight:700; font-size:15px; padding:13px; border-radius:8px; border:none; margin-top:6px;}
  .btn-submit:hover{background:var(--red-dark);}
  .btn-submit:disabled{opacity:.5;}

  .stage{display:none;}
  .stage.active{display:block;}

  .loading{text-align:center; padding:40px 0; color:var(--text-faint); font-size:13.5px;}
  .error-box{background:#FCEAEA; color:#B21616; padding:16px; border-radius:8px; font-size:13.5px; line-height:1.5;}

  .success-icon{width:48px; height:48px; border-radius:50%; background:#E9F5EE; color:#2E7D4F; display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
  .success-icon svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2;}
</style>
</head>
<body>

<div class="card">
  <div class="stage active" id="stage-loading"><div class="loading">Loading your survey…</div></div>

  <div class="stage" id="stage-error">
    <div class="error-box" id="error-message"></div>
  </div>

  <div class="stage" id="stage-survey">
    <div class="brand-row" id="brand-row"></div>
    <h1 id="survey-title">How did we do?</h1>
    <p class="sub" id="survey-sub"></p>
    <div id="questions-wrap"></div>
    <div class="field">
      <label>Comments, suggestions, or complaints</label>
      <textarea id="comments" placeholder="Anything you'd like us to know — good or bad"></textarea>
      <p class="hint">If something here needs following up, it goes straight to the team that can act on it.</p>
    </div>
    <div id="submit-error"></div>
    <button class="btn-submit" id="submit-btn" onclick="submitSurvey()">Submit feedback</button>
  </div>

  <div class="stage" id="stage-done">
    <div class="success-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h1>Thank you</h1>
    <p class="sub">Your feedback has been received. We appreciate you taking the time.</p>
  </div>
</div>

<script type="module">
// ── Configuration ──────────────────────────────────────────────────────────
// Same as accept-invite.html: safe to ship these in the page (public anon
// key, protected by RLS + the two narrowly-scoped functions this page
// calls), but replace with your real project values before deploying.
const SUPABASE_URL = "https://uzywxhptwavnvpfzbhkb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8XxT0I-Qdmswhd2I-TT_jg_CuI8a24f";
// ─────────────────────────────────────────────────────────────────────────

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showStage(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showError(msg){
  document.getElementById('error-message').textContent = msg;
  showStage('stage-error');
}

function getToken(){
  return new URLSearchParams(window.location.search).get('token');
}

let questions = [];
let ratings = {}; // question id -> rating

async function init(){
  const token = getToken();
  if(!token){ showError('This survey link is missing its token — please use the link from your email.'); return; }

  const { data, error } = await supabase.rpc('get_survey_by_token', { p_token: token });
  if(error || !data || data.error){
    showError('This survey link isn\u2019t valid. It may have already been used, or been copied incorrectly.');
    return;
  }
  if(data.status === 'completed'){
    showStage('stage-done');
    document.querySelector('#stage-done .sub').textContent = 'This survey has already been submitted — thank you for your feedback.';
    return;
  }
  if(data.status === 'expired'){
    showError('This survey link has expired. Please contact us if you\u2019d still like to share feedback.');
    return;
  }

  questions = data.questions || [];

  document.getElementById('brand-row').innerHTML = data.org_logo_url
    ? `<img src="${data.org_logo_url}" alt="${data.org_name} logo">`
    : `<span class="fallback">${data.org_name}</span>`;
  document.getElementById('survey-sub').textContent = `${data.customer_name} — we'd value your feedback on working with ${data.org_name}.`;

  const wrap = document.getElementById('questions-wrap');
  wrap.innerHTML = questions.map(q => `
    <div class="question">
      <div class="q-text">${q.question_text}</div>
      <div class="rating-row" id="q-${q.id}">
        ${[1,2,3,4,5].map(n => `<button type="button" class="rating-btn" data-q="${q.id}" data-val="${n}" onclick="selectRating('${q.id}', ${n})">
          <span class="num">${n}</span><span class="label">${['Poor','Below average','Average','Good','Excellent'][n-1]}</span>
        </button>`).join('')}
      </div>
    </div>
  `).join('');

  showStage('stage-survey');
}

window.selectRating = function(qId, val){
  ratings[qId] = val;
  document.querySelectorAll(`#q-${qId} .rating-btn`).forEach(btn => {
    btn.classList.toggle('selected', parseInt(btn.dataset.val,10) === val);
  });
};

window.submitSurvey = async function(){
  const unanswered = questions.filter(q => !ratings[q.id]);
  const errEl = document.getElementById('submit-error');
  errEl.innerHTML = '';
  if(unanswered.length){
    errEl.innerHTML = `<div class="error-box" style="margin-bottom:16px;">Please rate all ${questions.length} question${questions.length>1?'s':''} before submitting.</div>`;
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';

  const token = getToken();
  const ratingsPayload = questions.map(q => ({ id: q.id, rating: ratings[q.id] }));
  const comments = document.getElementById('comments').value.trim();

  const { data, error } = await supabase.rpc('submit_survey_response', {
    p_token: token, p_ratings: ratingsPayload, p_comments: comments
  });

  if(error || !data || data.error){
    btn.disabled = false; btn.textContent = 'Submit feedback';
    errEl.innerHTML = `<div class="error-box" style="margin-bottom:16px;">${(data && data.error) || 'Something went wrong submitting your feedback. Please try again.'}</div>`;
    return;
  }

  showStage('stage-done');
};

init();
</script>
</body>
</html>
