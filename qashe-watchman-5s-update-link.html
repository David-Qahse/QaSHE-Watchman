<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5S Inspection — QaSHE Watchman</title>
<style>
  :root{ --red:#B21616; --charcoal:#26241F; --cream:#F7F6F5; --text-dim:#615C59; --border:#E3E1DF; --green:#2E7D32; --amber:#B45309; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:Arial, sans-serif; background:var(--cream); color:var(--charcoal); padding:24px 16px;}
  .card{max-width:560px; margin:0 auto; background:#fff; border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,.06); padding:28px 24px;}
  #brand-row{margin-bottom:18px;}
  #brand-row img{max-height:44px;}
  .fallback{font-weight:700; font-size:18px; color:var(--red);}
  h1{font-size:19px; margin:0 0 4px;}
  .sub{font-size:13px; color:var(--text-dim); margin:0 0 20px; line-height:1.5;}
  .item{border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px;}
  .i-title{font-size:14px; font-weight:600; margin-bottom:10px;}
  .rating-row{display:flex; gap:8px; margin-bottom:8px;}
  .rating-btn{flex:1; padding:10px 4px; border:1.5px solid var(--border); border-radius:8px; background:#fff; cursor:pointer; font-size:12px; font-weight:600; text-align:center;}
  .rating-btn.conforms.selected{background:#E8F3E9; border-color:var(--green); color:var(--green);}
  .rating-btn.observation.selected{background:#FDF2E3; border-color:var(--amber); color:var(--amber);}
  .rating-btn.nonconformance.selected{background:#FBEAEA; border-color:var(--red); color:var(--red);}
  .item textarea{width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:13px; min-height:50px; resize:vertical;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; margin-top:18px;}
  #overall-notes{width:100%; min-height:80px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:14px; resize:vertical;}
  button.submit-btn{width:100%; margin-top:22px; padding:13px; border:none; border-radius:8px; background:var(--red); color:#fff; font-size:15px; font-weight:600; cursor:pointer;}
  button.submit-btn:disabled{opacity:.6; cursor:default;}
  .error-box{background:#FBEAEA; border:1px solid #EFC9C9; color:#8A1F1F; padding:14px; border-radius:8px; font-size:13.5px;}
  .stage{display:none;}
  .stage.active{display:block;}
  .done-icon{width:48px; height:48px; margin:0 auto 14px; display:block;}
</style>
</head>
<body>
<div class="card">
  <div id="brand-row"></div>

  <div id="stage-loading" class="stage active"><p class="sub">Loading…</p></div>

  <div id="stage-error" class="stage">
    <div class="error-box" id="error-message"></div>
  </div>

  <div id="stage-form" class="stage">
    <h1 id="insp-title"></h1>
    <p class="sub" id="insp-sub">Work through each item below, then submit.</p>
    <div id="items-list"></div>
    <label for="overall-notes">Overall notes (optional)</label>
    <textarea id="overall-notes" placeholder="Anything worth noting about this inspection overall"></textarea>
    <button class="submit-btn" id="submit-btn" onclick="submitInspection()">Submit</button>
  </div>

  <div id="stage-done" class="stage">
    <svg class="done-icon" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
    <p class="sub" style="text-align:center; font-size:14px;">Thank you — this inspection has been submitted.</p>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://uzywxhptwavnvpfzbhkb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8XxT0I-Qdmswhd2I-TT_jg_CuI8a24f';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const RESULTS = [
  { v: 'conforms', label: 'Conforms' },
  { v: 'observation', label: 'Observation' },
  { v: 'nonconformance', label: 'Nonconformance' },
];

function showStage(id){
  document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function getToken(){ return new URLSearchParams(window.location.search).get('token'); }

let items = [];

async function init(){
  const token = getToken();
  if(!token){
    document.getElementById('error-message').textContent = 'No link token found. Check the link you were sent and try again.';
    showStage('stage-error');
    return;
  }

  const { data, error } = await supabase.rpc('get_five_s_by_token', { p_token: token });
  if(error || !data || data.error){
    document.getElementById('error-message').textContent = (data && data.error) || 'We couldn\u2019t find this — the link may be incorrect.';
    showStage('stage-error');
    return;
  }

  document.getElementById('brand-row').innerHTML = data.org_logo_url
    ? `<img src="${data.org_logo_url}" alt="${data.org_name}">`
    : `<span class="fallback">${data.org_name || 'QaSHE Watchman'}</span>`;
  document.getElementById('insp-title').textContent = `5S Inspection — ${data.area}`;

  items = data.items || [];
  const list = document.getElementById('items-list');
  if(!items.length){
    list.innerHTML = '<p class="sub">No checklist items on this inspection — just add overall notes below.</p>';
  } else {
    list.innerHTML = items.map(item => `
      <div class="item">
        <div class="i-title">${item.item_text}</div>
        <div class="rating-row" id="rating-${item.id}">
          ${RESULTS.map(r => `<button type="button" class="rating-btn ${r.v}" data-item="${item.id}" data-val="${r.v}" onclick="selectResult('${item.id}','${r.v}')">${r.label}</button>`).join('')}
        </div>
        <textarea id="notes-${item.id}" placeholder="Notes (optional)"></textarea>
      </div>
    `).join('');
  }

  showStage('stage-form');
}

window.selectResult = function(itemId, val){
  document.querySelectorAll(`#rating-${itemId} .rating-btn`).forEach(b => {
    b.classList.toggle('selected', b.dataset.val === val);
  });
};

window.submitInspection = async function(){
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';

  const results = items.map(item => {
    const selected = document.querySelector(`#rating-${item.id} .rating-btn.selected`);
    return { id: item.id, result: selected ? selected.dataset.val : null, notes: document.getElementById('notes-'+item.id).value.trim() };
  }).filter(r => r.result);

  const overallNotes = document.getElementById('overall-notes').value.trim();

  const { data, error } = await supabase.rpc('submit_five_s_by_token', {
    p_token: getToken(), p_results: results, p_overall_notes: overallNotes || null,
  });

  if(error || !data || data.error){
    btn.disabled = false; btn.textContent = 'Submit';
    document.getElementById('error-message').textContent = (data && data.error) || 'Something went wrong submitting this. Please try again.';
    showStage('stage-error');
    return;
  }

  showStage('stage-done');
};

init();
</script>
</body>
</html>
