<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Plant: Water Treatment</title>
<style>
  :root{--red:#B21616;--red-dark:#7E0F0F;--red-tint:#FCEAEA;--grey-tint:#F0F0EF;--bg:#F7F6F5;--border:#E3E1DF;--text:#1E1C1B;--dim:#615C59;--faint:#9C9895;--green:#2E7D4F;--green-tint:#E9F5EE;--amber:#B8791C;--amber-tint:#FBF1E1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:40px}
  .top{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  .top svg{width:30px;height:30px;flex:none}
  .top b{font-size:16px}.top small{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  h1{font-size:20px;line-height:1.25}.ref{font-size:12px;color:var(--faint);margin-bottom:4px}
  .meta{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.5}
  label.l{display:block;font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
  input[type=text],textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;font:16px Arial,Helvetica,sans-serif;background:#fff;color:var(--text)}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--red)}
  .item{border-top:1px solid var(--border);padding:14px 0}.item:first-of-type{border-top:0;padding-top:4px}
  .item .t{font-size:15px;line-height:1.4;margin-bottom:10px}.item .n{color:var(--faint);font-size:12px;margin-right:6px}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:11px 0;font:700 16px Arial,Helvetica,sans-serif;color:var(--dim);cursor:pointer}
  .scale button.on[data-v="1"],.scale button.on[data-v="2"]{background:var(--green);border-color:var(--green);color:#fff}
  .scale button.on[data-v="3"]{background:var(--amber);border-color:var(--amber);color:#fff}
  .scale button.on[data-v="4"],.scale button.on[data-v="5"]{background:var(--red);border-color:var(--red);color:#fff}
  .legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:5px}
  .ph{margin-top:8px;margin-left:14px;font-size:13px;color:var(--red);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs div{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #ccc}.thumbs b{position:absolute;top:-6px;right:-6px;background:#b00020;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:13px;cursor:pointer}
  .note{margin-top:8px;font-size:13px;color:var(--red);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
  .item textarea{min-height:60px;margin-top:8px;font-size:14px}
  .item.missing{background:var(--red-tint);margin:0 -16px;padding-left:16px;padding-right:16px}
  .opt{display:flex;gap:10px}.opt label{flex:1;border:2px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center;font-weight:700;font-size:14px;cursor:pointer;color:var(--dim)}
  .opt input{display:none}
  .opt input:checked + span{color:#fff}
  .opt label:has(input[value=compliant]:checked){background:var(--green);border-color:var(--green);color:#fff}
  .opt label:has(input[value=quarantine]:checked){background:var(--red);border-color:var(--red);color:#fff}
  .go{width:100%;background:var(--red);color:#fff;border:0;border-radius:10px;padding:16px;font:700 16px Arial,Helvetica,sans-serif;cursor:pointer}
  .go:disabled{opacity:.55}
  .err{background:var(--red-tint);color:var(--red);border-radius:8px;padding:12px;font-size:13.5px;margin-bottom:12px;display:none;line-height:1.45}
  .big{text-align:center;padding:30px 16px}.big .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
  .pill{display:inline-block;border-radius:100px;padding:5px 12px;font-size:12px;font-weight:700}
  .p-ok{background:var(--green-tint);color:var(--green)}.p-bad{background:var(--red-tint);color:var(--red)}
  .sub{font-size:12px;color:var(--faint);text-align:center;margin-top:18px}

.res{display:inline-block;padding:3px 10px;border-radius:12px;color:#fff;font-size:12px;font-weight:700}
.btn{display:block;width:100%;text-align:center;background:var(--red);color:#fff;border:0;border-radius:10px;padding:14px;font:700 16px Arial,Helvetica,sans-serif;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.alt{background:#fff;color:var(--red);border:1px solid var(--red)}
</style></head><body>
<div class="top"><div><b id="org">Water Treatment</b><small>Plant information</small></div></div>
<div class="wrap" id="app"><div class="card">Loading…</div></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient('https://uzywxhptwavnvpfzbhkb.supabase.co', 'sb_publishable_8XxT0I-Qdmswhd2I-TT_jg_CuI8a24f');

const token = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app'), esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fd = d => d ? new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : 'Not yet';
const RES = { compliant:['Compliant','#2E7D4F'], attention:['Attention required','#B26A16'], critical:['Critical','#B3261E'] };
let d = null, img = null;
async function load(){
  const { data, error } = await supabase.rpc('wt_plant_public', { p_token: token });
  if(error || !data || !data.ok){ app.innerHTML = '<div class="card"><h1>This QR code could not be read</h1><p class="meta">Please contact the service provider.</p></div>'; return; }
  d = data; document.getElementById('org').textContent = d.division || d.org || 'Water Treatment'; draw();
}
function draw(done){
  const p = d.plant, r = RES[p.last_result];
  const od = p.next_service && p.next_service < new Date().toISOString().slice(0,10);
  app.innerHTML = `<div class="card">${d.logo ? `<img src="${d.logo}" style="max-height:56px;margin-bottom:10px">` : ''}<div class="ref">${esc(p.ref || '')}</div><h1>${esc(p.name)}</h1><div class="meta">${esc(p.customer || '')}<br>${esc(p.site || '')}<br>Last service: <b>${fd(p.last_service)}</b> ${r ? `<span class="res" style="background:${r[1]}">${r[0]}</span>` : ''}<br>Next service due: <b style="${od ? 'color:#B3261E' : ''}">${fd(p.next_service)}</b>${od ? ' (overdue)' : ''}</div></div>
  ${done ? '<div class="card"><b>Thank you.</b><p class="meta">Your report has been sent to the service provider.</p></div>' : `<div class="card"><h2 style="font-size:16px;margin-bottom:10px">Report a problem with this plant</h2>
    <label class="l">Your name</label><input type="text" id="n"><div style="height:10px"></div><label class="l">Phone or email</label><input type="text" id="c"><div style="height:10px"></div>
    <label class="l">What is wrong?</label><textarea id="t" placeholder="For example: water leaking at the feed pump"></textarea><div style="height:10px"></div>
    <label class="l">Photo (optional)</label><input type="file" id="f" accept="image/*" capture="environment"><div id="pv"></div>
    <button class="btn" id="go">Send report</button><div id="msg" class="meta" style="color:#B3261E"></div></div>`}
  <div class="card"><a class="btn alt" style="margin-top:0" href="index.html?wt=${encodeURIComponent(token)}">Service technician: sign in</a>${d.tel ? `<p class="meta" style="margin-top:10px">Service desk: <b>${esc(d.tel)}</b></p>` : ''}${d.website ? `<p class="meta">${esc(d.website)}</p>` : ''}</div>`;
  if(done) return;
  document.getElementById('f').onchange = async e => { const f = e.target.files[0]; if(!f) return; img = await shrink(f); document.getElementById('pv').innerHTML = img ? `<img src="${img}" style="max-width:100%;margin-top:8px;border-radius:8px">` : ''; };
  document.getElementById('go').onclick = send;
}
function shrink(file){ return new Promise(res => { const im = new Image(), u = URL.createObjectURL(file); im.onload = () => { const m = 900, k = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.7)); }; im.onerror = () => res(null); im.src = u; }); }
async function send(){
  const b = document.getElementById('go'), msg = document.getElementById('msg'), t = document.getElementById('t').value.trim();
  if(t.length < 5){ msg.textContent = 'Please describe the problem.'; return; }
  b.disabled = true; b.textContent = 'Sending…'; msg.textContent = '';
  try{
    const { error } = await supabase.rpc('wt_fault_submit', { p_token: token, p_name: document.getElementById('n').value.trim() || null, p_contact: document.getElementById('c').value.trim() || null, p_desc: t, p_image: img });
    if(error) throw error; draw(true);
  }catch(e){ msg.textContent = (e && e.message) || 'Could not send. Please try again.'; b.disabled = false; b.textContent = 'Send report'; }
}
load();
</script></body></html>
