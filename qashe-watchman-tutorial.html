<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QaSHE Watchman Tutorial</title>
<meta name="description" content="A guided tutorial of QaSHE Watchman: value to the business, contribution to ISO certification, an overview of all modules and a detailed walk-through of each.">
<style>html,body{margin:0;height:100%;background:#0B0E14}#host{position:fixed;inset:0}.wmt{position:fixed;inset:0;z-index:100000;background:#0B0E14;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.wmt.emb{position:absolute;z-index:1}
.wmt *{box-sizing:border-box}
.wmt-stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;background:radial-gradient(1200px 700px at 78% -10%,#2a1216 0,#13161f 55%,#0d1017 100%);overflow:hidden;border-radius:6px}
.wmt-slide{position:absolute;inset:0;padding:64px 72px 70px;opacity:0;transition:opacity .45s}
.wmt-slide.on{opacity:1}
.wmt-slide::before{content:"";position:absolute;right:-180px;bottom:-200px;width:620px;height:620px;border-radius:50%;border:34px solid rgba(255,255,255,.035);border-top-color:rgba(178,22,22,.22);border-right-color:rgba(166,171,181,.08);pointer-events:none}
.wmt [data-i]{opacity:0}
.wmt-slide.on [data-i]{animation:wmtIn .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 85ms)}
@keyframes wmtIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.wmt .bld{opacity:0;transform:translateY(12px);transition:opacity .55s,transform .55s}
.wmt .bld.show{opacity:1;transform:none}
.wmt h1{font-size:60px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.5px}
.wmt h2{font-size:38px;line-height:1.12;margin:0;font-weight:800;letter-spacing:-.3px}
.wmt h3{font-size:20px;margin:0 0 6px;font-weight:700}
.wmt p{margin:0}
.wmt .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#FF8A80;font-weight:700;margin-bottom:10px}
.wmt .lede{font-size:21px;line-height:1.45;color:#C9CFDB;max-width:880px;margin-top:14px}
.wmt .hl{color:#FF6B5E}
.wmt .card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:18px 20px}
.wmt .card p{font-size:15px;line-height:1.45;color:#C9CFDB}
.wmt .grid{display:grid;gap:16px}
.wmt .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#E6E9F0;margin:0 6px 8px 0}
.wmt .chip.red{background:rgba(178,22,22,.28);border-color:rgba(255,107,94,.5);color:#FFD7D2}
.wmt .chip.go{cursor:pointer}
.wmt .chip.go:hover{background:rgba(255,255,255,.18)}
.wmt .ico{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#B21616,#7E0F0F);display:flex;align-items:center;justify-content:center;flex:none}
.wmt .ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wmt .btn{border:0;border-radius:999px;padding:13px 26px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.wmt .btn.p{background:#B21616;color:#fff}
.wmt .btn.p:hover{background:#d11c1c}
.wmt .btn.g{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35)}
.wmt .btn.g:hover{background:rgba(255,255,255,.1)}
.wmt /* chrome */
.wmt-top{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(8,10,15,.92);z-index:5;border-bottom:1px solid rgba(255,255,255,.07)}
.wmt-top .ttl{font-size:13px;font-weight:700;color:#C9CFDB;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmt-top .ttl b{color:#fff}
.wmt-top .sp{flex:1}
.wmt-ib{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:9px;height:30px;min-width:30px;padding:0 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.wmt-ib:hover{background:rgba(255,255,255,.16)}
.wmt-ib.on{background:#B21616;border-color:#B21616}
.wmt-bot{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(8,10,15,.92);z-index:5;border-top:1px solid rgba(255,255,255,.07)}
.wmt-prog{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;cursor:pointer}
.wmt-prog i{display:block;height:100%;background:linear-gradient(90deg,#B21616,#FF6B5E);width:0;transition:width .4s}
.wmt-cnt{font-size:12px;color:#A9B0BE;min-width:70px;text-align:center}
.wmt-view{position:absolute;left:0;right:0;top:46px;bottom:46px;overflow:hidden}
.wmt-drawer{position:absolute;left:0;top:46px;bottom:46px;width:340px;background:#0F131B;border-right:1px solid rgba(255,255,255,.1);z-index:6;transform:translateX(-102%);transition:transform .3s;overflow:auto;padding:12px 10px}
.wmt-drawer.open{transform:none}
.wmt-drawer h4{margin:12px 6px 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#FF8A80}
.wmt-drawer a{display:block;padding:7px 10px;border-radius:8px;font-size:13px;color:#C9CFDB;cursor:pointer}
.wmt-drawer a:hover{background:rgba(255,255,255,.08);color:#fff}
.wmt-drawer a.cur{background:rgba(178,22,22,.35);color:#fff}
.wmt /* mock application */
.mock{position:relative;background:#fff;color:#1F2933;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;font-size:12px;width:100%;height:100%}
.wmt .mk-bar{height:28px;background:#EEF0F3;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:11px;color:#5A6472;font-weight:700}
.wmt .mk-bar i{width:9px;height:9px;border-radius:50%;background:#C9CED6;display:block}
.wmt .mk-bar i:first-child{background:#E5584C}
.wmt .mk-bar span{margin-left:10px}
.wmt .mk-body{display:flex;height:calc(100% - 28px)}
.wmt .mk-side{width:118px;background:#1B1F29;padding:10px 8px;flex:none}
.wmt .mk-side b{display:block;color:#fff;font-size:11px;margin:0 4px 10px}
.wmt .mk-side div{height:20px;border-radius:5px;margin-bottom:5px;background:rgba(255,255,255,.07);color:#A9B0BE;font-size:10px;line-height:20px;padding:0 7px;white-space:nowrap;overflow:hidden}
.wmt .mk-side div.act{background:#B21616;color:#fff}
.wmt .mk-main{flex:1;padding:14px 16px;position:relative;overflow:hidden}
.wmt .mk-h{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.wmt .mk-h u{margin-left:auto;text-decoration:none;background:#B21616;color:#fff;border-radius:7px;padding:6px 12px;font-size:11px;font-weight:700;transition:transform .15s,background .2s}
.wmt .mk-h u.hit,.wmt .hit{transform:scale(.93)}
.wmt .mk-t{width:100%;border-collapse:collapse}
.wmt .mk-t th{text-align:left;font-size:10px;text-transform:uppercase;color:#7B8794;padding:5px 7px;border-bottom:2px solid #E4E7EB}
.wmt .mk-t td{padding:7px;border-bottom:1px solid #EEF0F3;font-size:11.5px}
.wmt .mk-t tr.nr{opacity:0;transform:translateX(-14px);transition:.6s;background:#FFF4E0}
.wmt .mk-t tr.nr.show{opacity:1;transform:none}
.wmt .pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:700;color:#fff;background:#6B7785}
.wmt .pill.r{background:#D32F2F}
.wmt .pill.o{background:#EF7B00}
.wmt .pill.g{background:#2E9E5B}
.wmt .pill.b{background:#2F6FDE}
.wmt .mk-panel{position:absolute;right:0;top:0;bottom:0;width:58%;background:#fff;box-shadow:-12px 0 30px rgba(0,0,0,.18);padding:14px 16px;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:2}
.wmt .mk-panel.open{transform:none}
.wmt .mk-f{margin-bottom:9px}
.wmt .mk-f label{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;color:#7B8794;margin-bottom:3px}
.wmt .mk-f .in{height:26px;border:1px solid #CBD2D9;border-radius:6px;padding:0 8px;line-height:24px;font-size:11.5px;background:#fff;overflow:hidden;white-space:nowrap}
.wmt .mk-f .in span{display:inline-block;clip-path:inset(0 100% 0 0)}
.wmt .mk-f .in span.typed{animation:wmtType var(--d,1.1s) steps(var(--n,16)) forwards}
@keyframes wmtType{to{clip-path:inset(0 0 0 0)}}
.wmt .mk-f.gate{transition:opacity .5s,filter .5s}
.wmt .mk-panel.locked .mk-f.gate{opacity:.18;filter:blur(1.2px)}
.wmt .mk-f .in.cat{border-color:#B21616;box-shadow:0 0 0 3px rgba(178,22,22,.14)}
.wmt .mk-btn{display:inline-block;background:#B21616;color:#fff;border-radius:7px;padding:7px 14px;font-weight:700;font-size:11px;transition:transform .15s}
.wmt .cur{position:absolute;left:0;top:0;width:22px;height:22px;z-index:9;pointer-events:none;transition:transform .9s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.wmt .cur svg{width:22px;height:22px}
.wmt .cur::after{content:"";position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;border:2px solid #B21616;opacity:0;transform:scale(.3)}
.wmt .cur.ck::after{animation:wmtRip .55s ease-out}
@keyframes wmtRip{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.4)}}
.wmt .tile{background:#F5F6F8;border-radius:10px;padding:10px 12px}
.wmt .tile b{display:block;font-size:24px;line-height:1.1}
.wmt .tile small{font-size:10px;color:#7B8794;text-transform:uppercase;font-weight:700}
.wmt .bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding:6px 4px;border-bottom:2px solid #E4E7EB}
.wmt .bars i{flex:1;background:linear-gradient(#FF6B5E,#B21616);border-radius:5px 5px 0 0;height:3%;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.wmt .stg{display:flex;gap:8px;align-items:stretch}
.wmt .stg>div{flex:1;border:2px solid #E4E7EB;border-radius:10px;padding:10px 8px;text-align:center;font-size:11px;font-weight:700;color:#7B8794;transition:.5s;position:relative}
.wmt .stg>div.lit{border-color:#B21616;color:#B21616;background:#FFF1F0;transform:translateY(-4px)}
.wmt .stg>div.done{border-color:#2E9E5B;color:#2E9E5B;background:#EDF8F2}
.wmt .stg>div small{display:block;font-weight:400;color:inherit;margin-top:4px;font-size:10px}
.wmt .ck-i{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #EEF0F3;font-size:11.5px}
.wmt .ck-i .bx{width:16px;height:16px;border-radius:4px;border:2px solid #CBD2D9;transition:.3s;flex:none;position:relative}
.wmt .ck-i.t .bx{background:#2E9E5B;border-color:#2E9E5B}
.wmt .ck-i.t .bx::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}
.wmt .ck-i.f .bx{background:#D32F2F;border-color:#D32F2F}
.wmt .ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(#2E9E5B calc(var(--p,0)*1%),#E4E7EB 0);display:flex;align-items:center;justify-content:center;transition:.3s}
.wmt .ring b{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.wmt .tl-i{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;border:1px solid #E4E7EB;border-radius:9px;opacity:0;transform:translateY(10px);transition:.5s}
.wmt .tl-i.show{opacity:1;transform:none}
.wmt .tl-i.warn{border-color:#EF7B00;background:#FFF6E8}
.wmt .tl-i .d{width:60px;font-weight:800;font-size:11px;color:#7B8794}
.wmt .toast-m{position:absolute;right:14px;bottom:14px;background:#1B1F29;color:#fff;border-radius:10px;padding:10px 14px;font-size:11.5px;font-weight:700;transform:translateY(80px);opacity:0;transition:.5s;z-index:3;max-width:60%}
.wmt .toast-m.show{transform:none;opacity:1}
.wmt .mx{display:grid;gap:4px}
.wmt .mx div{height:26px;border-radius:5px;background:#EEF0F3;transition:.4s;font-size:10px;line-height:26px;text-align:center;color:#fff;font-weight:700;overflow:hidden;white-space:nowrap}
.wmt .mx div.h{background:transparent;color:#7B8794;text-align:left;padding-left:2px}
.wmt .mx div.g{background:#2E9E5B}
.wmt .mx div.a{background:#EF7B00}
.wmt .mx div.r{background:#D32F2F}
.wmt .docc{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:7px;border:1px solid #E4E7EB;border-radius:9px;opacity:0;transform:translateX(-12px);transition:.5s}
.wmt .docc.show{opacity:1;transform:none}
.wmt .docc b{font-size:11.5px}
.wmt .docc small{display:block;color:#7B8794;font-size:10px}
.wmt .kb{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:215px}
.wmt .kb>.kcol{background:#F5F6F8;border-radius:9px;padding:7px;position:relative}
.wmt .kb>.kcol>small{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#7B8794;margin-bottom:6px}
.wmt .kc{position:absolute;width:calc(25% - 12px);background:#fff;border:1px solid #E4E7EB;border-radius:8px;padding:7px;font-size:10.5px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:left .8s cubic-bezier(.4,.1,.2,1),top .8s}
.wmt .kc small{display:block;font-weight:400;color:#7B8794}
.wmt .org{position:relative;height:250px}
.wmt .org .n{position:absolute;background:#fff;border:2px solid #E4E7EB;border-radius:9px;padding:6px 10px;font-size:10.5px;font-weight:700;text-align:center;opacity:0;transform:scale(.8);transition:.5s;min-width:100px}
.wmt .org .n.show{opacity:1;transform:none}
.wmt .org .n small{display:block;font-weight:400;color:#7B8794}
.wmt .org svg{position:absolute;inset:0;width:100%;height:100%}
.wmt .org svg path{stroke:#B7BEC8;stroke-width:2;fill:none;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset .8s}
.wmt .org svg path.show{stroke-dashoffset:0}
.wmt .cg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.wmt .cg div{border-radius:8px;padding:9px 8px;background:#F0F2F5;font-size:10.5px;font-weight:700;color:#7B8794;transition:.5s;min-height:48px}
.wmt .cg div.on{background:#E6F6EC;color:#1D7A44}
.wmt .cg div.part{background:#FFF1DC;color:#B35A00}
.wmt .capbar{margin-top:14px;font-size:17px;color:#fff;font-weight:700;min-height:26px;transition:opacity .3s}
.wmt .steps{list-style:none;margin:0;padding:0}
.wmt .steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-size:15.5px;line-height:1.4;color:#B8BFCC;transition:.4s}
.wmt .steps li b{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.wmt .steps li.act{background:rgba(178,22,22,.28);border-color:#FF6B5E;color:#fff;transform:translateX(6px)}
.wmt .steps li.act b{background:#B21616}
.wmt svg.wmz{width:100%;height:100%}
.wmt .wmz .wmz-ring{transform-box:view-box;transform-origin:16px 16px;animation:wmzSpin 14s linear infinite}
.wmt .wmz .wmz-eye{transform-box:fill-box;transform-origin:center;animation:wmzBlink 4.4s infinite}
@media (prefers-reduced-motion:reduce){.wmt-slide.on [data-i]{animation:none;opacity:1}.wmt *{transition:none !important}}
.wm-tut-btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;background:#2F4B66;color:#fff;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12.5px;padding:4px 14px 4px 5px;border-radius:999px;box-shadow:0 3px 10px rgba(47,75,102,.35);white-space:nowrap;margin-right:8px}
.wm-tut-btn:hover{background:#1F3347}
.wm-tut-btn .ico svg.wmz{width:30px !important;height:30px !important}
.wm-tut-btn .ico{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center}
@media (max-width:640px){.wm-tut-btn .lbl{display:none}.wm-tut-btn{padding:4px}}
.wmt .hid{display:none}
.wmt-vp{position:absolute;right:12px;top:52px;width:290px;background:#0F131B;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;z-index:8;display:none;font-size:13px;color:#C9CFDB}
.wmt-vp.open{display:block}
.wmt-vp b{display:block;color:#fff;margin-bottom:8px;font-size:14px}
.wmt-vp label{display:block;margin-bottom:10px;font-weight:700;font-size:12px}
.wmt-vp select,.wmt-vp input[type=range]{width:100%;margin-top:4px;background:#1B2030;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:5px;font-family:inherit}
.wmt-vp label.ck{display:flex;align-items:center;gap:8px}
.wmt-vp small{display:block;margin-top:10px;color:#8B93A3;line-height:1.35}
.wmt-cap{position:absolute;left:50%;transform:translateX(-50%);bottom:62px;max-width:86%;background:rgba(5,7,11,.82);color:#fff;font-size:19px;line-height:1.4;padding:10px 20px;border-radius:12px;z-index:7;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.wmt.vid .wmt-top,.wmt.vid .wmt-bot{display:none}
.wmt.vid .wmt-view{top:0;bottom:0}
.wmt.vid .wmt-cap{bottom:34px;font-size:22px}
@media (max-width:760px){.wmt-top .ttl{display:none}.wmt-cap{font-size:15px}}</style></head>
<body><div id="host"></div>
<script>
/* ===== b63a: Watchman face mascot (ring, no antenna): smile = Ask me, grin = Report a bug, neutral = Request a change ===== */
(function(){
  const css = document.createElement('style'); css.id = 'b63a-css'; css.textContent = `
  .wmz .wmz-ring{transform-box:view-box; transform-origin:16px 16px; animation:wmzSpin 14s linear infinite}
  .wmz .wmz-face{transform-box:view-box; transform-origin:16px 17px; animation:wmzBreathe 4.6s ease-in-out infinite}
  .wmz .wmz-eye{transform-box:fill-box; transform-origin:center; animation:wmzBlink 4.4s infinite}
  .wmz .wmz-eye.b{animation-delay:.04s}
  .wmz .wmz-look{animation:wmzLook 7s ease-in-out infinite}
  .wmz .wmz-mouth{transform-box:fill-box; transform-origin:center}
  .wmz.help .wmz-mouth{animation:wmzSmile 4.4s ease-in-out infinite}
  .wmz.bug .wmz-mouth{animation:wmzGrin 3.2s ease-in-out infinite}
  @keyframes wmzSpin{to{transform:rotate(360deg)}}
  @keyframes wmzBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  @keyframes wmzBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  @keyframes wmzLook{0%,38%,100%{transform:translateX(0)}46%,60%{transform:translateX(.9px)}70%,84%{transform:translateX(-.9px)}}
  @keyframes wmzSmile{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
  @keyframes wmzGrin{0%,100%{transform:scale(1)}50%{transform:scale(1.07,1.12)}}
  .watchman-chat-fab:hover .wmz .wmz-ring,.wm-bug-btn:hover .wmz .wmz-ring,.wm-chg-btn:hover .wmz .wmz-ring,.header-report-fab:hover .wmz .wmz-ring,.wm-tut-btn:hover .wmz .wmz-ring{animation-duration:3s}
  @media (prefers-reduced-motion:reduce){.wmz *{animation:none !important}}
  svg.wmz{display:block}
  .sb-brand .watchman-chat-fab .wm-pill-head svg.wmz,.wm-bug-btn .wm-pill-head svg.wmz,.wm-chg-btn .ico svg.wmz,.wm-tut-btn .ico svg.wmz{width:34px !important; height:34px !important; stroke:none !important; fill:none !important}
  `;
  document.head.appendChild(css);
  const INK = '#23272F';
  const eyes = () => `<g class="wmz-look"><ellipse class="wmz-eye" cx="12.7" cy="14.1" rx="1.5" ry="1.95" fill="${INK}"/><ellipse class="wmz-eye b" cx="19.3" cy="14.1" rx="1.5" ry="1.95" fill="${INK}"/></g>`;
  const mouth = k => k === 'bug'

    num: (s, v) => { const el = q(s); if(!el) return; const t = parseFloat(v), suf = String(v).replace(/^[\d.]+/, ''); let n = 0; const iv = setInterval(() => { n += Math.max(1, Math.ceil(t / 18)); if(n >= t){ n = t; clearInterval(iv); } el.textContent = Math.round(n) + suf; }, 45); timers.push(iv); },
    bars: h => { [...mock.querySelectorAll('#bars i')].forEach((b, i) => b.style.height = (h[i] || 20) + '%'); },
    ring: p => { const r = q('#rg'); if(r){ r.style.setProperty('--p', p); q('#rgv').textContent = p + '%'; } },
    fillc: (s, c) => { const el = q(s); if(el){ el.classList.add(c); el.textContent = c === 'g' ? 'Competent' : c === 'a' ? 'Expiring' : 'Gap'; } },
    pill: (s, t) => { const el = q(s); if(el){ el.textContent = t; el.classList.add('g'); } },
    move: (s, col) => { const el = q(s); if(el) el.style.left = `calc(${col * 25}% + 6px)`; }
  };
  function play(){
    if(dead) return; loopNo++; mock.innerHTML = init; lis.forEach(l => l.classList.remove('act')); if(cap) cap.textContent = '';
    spec.sc.forEach(a => { timers.push(setTimeout(() => { if(!dead && ops[a[1]]) ops[a[1]](a[2], a[3]); }, a[0])); });
    timers.push(setTimeout(() => { if(cb.done) cb.done(loopNo); }, spec.total));
    timers.push(setTimeout(play, spec.total + 2500));
  }
  setTimeout(() => { if(!dead) play(); }, 700);
  return () => { dead = true; timers.forEach(t => { clearTimeout(t); clearInterval(t); }); };
}

function playlist(mode){
  const I = introSlides(); let L;
  if(mode === 'full'){
    L = [I.title, I.index, I.what, I.value, I.before, I.iso, I.pdca, I.overview, I.conn];
    CHAPTERS.forEach(c => { L.push(chapterSlide(c)); MODS.filter(m => m.ch === c[0]).forEach(m => L.push(...modSlides(m))); });
    L.push(I.roles, I.helpers, I.start, I.close);
  } else {
    L = [I.title, I.index, I.what, I.iso];
    CHAPTERS.forEach(c => { const ms = MODS.filter(m => m.ch === c[0] && (mode.has(m.id))); if(!ms.length) return; L.push(chapterSlide(c)); ms.forEach(m => L.push(...modSlides(m))); });
    L.push(I.start, I.close);
  }
  L.forEach(s => { if(!s.narr && NARR[s.id]) s.narr = NARR[s.id]; if(s.id === 'index') s.hold = true; });
  return L;
}
