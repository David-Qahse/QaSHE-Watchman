<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Inspection</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --red:#B21616; --red-dark:#7E0F0F; --bg:#F7F6F5; --panel:#fff; --border:#E3E1DF; --text:#1E1C1B; --dim:#615C59; --faint:#9C9895; --green:#2E7D4F; --green-tint:#E9F5EE; --amber:#B2790F; --amber-tint:#FCF3E3; --red-tint:#FCEAEA; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#161413; --panel:#211F1E; --border:#3A3735; --text:#F2EFEC; --dim:#B5AFAB; --faint:#8A8582; --green-tint:#1B2E23; --amber-tint:#33290F; --red-tint:#361818; } }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:16px; min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:14px;}
  h1{font-family:'Poppins'; font-size:20px; margin-bottom:4px;}
  .sub{font-size:13px; color:var(--dim); line-height:1.5;}
  .ref{font-size:12px; color:var(--faint); font-weight:600; letter-spacing:.04em;}
  label{font-size:13px; font-weight:600; display:block; margin:14px 0 6px;}
  input[type=text], textarea{width:100%; border:1.5px solid var(--border); border-radius:8px; padding:12px; font-size:16px; background:var(--panel); color:var(--text); font-family:inherit;}
  textarea{min-height:70px;}
  .item{border-top:1px solid var(--border); padding:14px 0;}
  .item:first-child{border-top:none;}
  .item .t{font-size:14.5px; font-weight:600; line-height:1.4; margin-bottom:10px;}
  .rate{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .rate button{border:1.5px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:12px 0; font-size:16px; font-weight:700;}
  .rate button.on1,.rate button.on2{background:var(--green); border-color:var(--green); color:#fff;}
  .rate button.on3{background:var(--amber); border-color:var(--amber); color:#fff;}
  .rate button.on4,.rate button.on5{background:var(--red); border-color:var(--red); color:#fff;}
  .legend{font-size:11.5px; color:var(--faint); margin-top:6px; line-height:1.5;}
  .item input{margin-top:8px; font-size:14px; padding:9px 10px;}
  .big{width:100%; border:none; border-radius:10px; padding:16px; font-size:16px; font-weight:700; color:#fff; background:var(--red); margin-top:10px;}
  .big:disabled{opacity:.5;}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .seg button{border:1.5px solid var(--border); background:var(--panel); color:var(--text); border-radius:10px; padding:14px 8px; font-size:14px; font-weight:700;}
  .seg button.ok{background:var(--green); border-color:var(--green); color:#fff;}
  .seg button.q{background:var(--red); border-color:var(--red); color:#fff;}
  .msg{padding:14px; border-radius:10px; font-size:14px; line-height:1.5;}
  .msg.ok{background:var(--green-tint); color:var(--green);} .msg.err{background:var(--red-tint); color:var(--red);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><p class="sub">Loading asset…</p></div></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient('https://uzywxhptwavnvpfzbhkb.supabase.co', 'sb_publishable_8XxT0I-Qdmswhd2I-TT_jg_CuI8a24f');
const token = new URLSearchParams(location.search).get('t');
const app = document.getElementById('app');
const LEG = {1:'Perfect',2:'Good, minor wear',3:'Fair, monitor',4:'Poor, needs attention',5:'Write off'};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = null, results = {}, status = null;

async function load(){
  if(!token){ app.innerHTML = '<div class="card"><div class="msg err">This QR code is not valid.</div></div>'; return; }
  const { data: d, error } = await supabase.rpc('scan_get_asset', { p_token: token });
  if(error || !d){ app.innerHTML = '<div class="card"><div class="msg err">We could not find this asset. The label may be out of date: please contact your administrator.</div></div>'; return; }
  data = d; render();
}
function render(){
  const a = data.asset, items = data.items || [];
  app.innerHTML = `
    <div class="card">
      <div class="ref">${esc(a.org_name||'')} · ${esc(a.ref_code)}</div>
      <h1>${esc(a.description)}</h1>
      <p class="sub">${[a.location, a.category].filter(Boolean).map(esc).join(' · ')}${a.last_inspection_date ? '<br>Last inspected ' + esc(a.last_inspection_date) : '<br>No previous inspection recorded'}</p>
    </div>
    <div class="card">
      <label style="margin-top:0;">Your name</label>
      <input type="text" id="who" autocomplete="name" placeholder="Full name" value="${esc(localStorage.getItem('qw_inspector')||'')}">
      ${items.length ? `<label>Checklist</label><div class="legend" style="margin:-2px 0 6px;">Tap 1 to 5 for each item: 1 Perfect · 2 Good · 3 Fair · 4 Poor · 5 Write off</div>
      ${items.map((it,i) => `<div class="item"><div class="t">${i+1}. ${esc(it.text)}</div>
        <div class="rate">${[1,2,3,4,5].map(n => `<button type="button" data-i="${i}" data-n="${n}">${n}</button>`).join('')}</div>
        <input type="text" data-note="${i}" placeholder="Note (optional)"></div>`).join('')}`
      : '<p class="sub" style="margin-top:12px;">This asset has no checklist yet, so record an overall result and notes.</p>'}
      <label>Overall result</label>
      <div class="seg"><button type="button" id="r-ok">✔ Safe to use</button><button type="button" id="r-q">⚠ Quarantine</button></div>
      <label>Notes</label><textarea id="notes" placeholder="Anything the responsible person should know"></textarea>
      <button class="big" id="go">Submit inspection</button>
      <div id="out" style="margin-top:12px;"></div>
    </div>`;
  app.querySelectorAll('.rate button').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, n = +b.dataset.n; results[i] = n;
    app.querySelectorAll(`.rate button[data-i="${i}"]`).forEach(x => x.className = (+x.dataset.n === n) ? 'on'+n : '');
    if(n >= 4 && !status) pick('q');
    if(items.length && Object.keys(results).length === items.length && !status) pick('ok');
  });
  document.getElementById('r-ok').onclick = () => pick('ok');
  document.getElementById('r-q').onclick = () => pick('q');
  document.getElementById('go').onclick = submit;
}
function pick(s){ status = s; document.getElementById('r-ok').className = s==='ok' ? 'ok' : ''; document.getElementById('r-q').className = s==='q' ? 'q' : ''; }
async function submit(){
  const out = document.getElementById('out'), items = data.items || [];
  const who = document.getElementById('who').value.trim();
  if(!who){ out.innerHTML = '<div class="msg err">Please enter your name.</div>'; return; }
  if(items.length && Object.keys(results).length < items.length){ out.innerHTML = '<div class="msg err">Please rate every checklist item.</div>'; return; }
  if(!status){ out.innerHTML = '<div class="msg err">Choose the overall result: safe to use or quarantine.</div>'; return; }
  localStorage.setItem('qw_inspector', who);
  const payload = items.map((it,i) => ({ text: it.text, sort: it.sort, result: String(results[i]), notes: (app.querySelector(`[data-note="${i}"]`).value||'').trim() }));
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Submitting…';
  const { data: res, error } = await supabase.rpc('scan_submit_inspection', { p_token: token, p_inspector: who, p_status: status==='q' ? 'quarantine' : 'compliant', p_notes: document.getElementById('notes').value.trim(), p_items: payload });
  if(error){ btn.disabled = false; btn.textContent = 'Submit inspection'; out.innerHTML = '<div class="msg err">Could not submit: ' + esc(error.message) + '</div>'; return; }
  app.innerHTML = `<div class="card"><div class="msg ok"><b>Inspection submitted.</b><br>${esc(data.asset.ref_code)} has been updated in Watchman${res && res.next_inspection_date ? '. Next inspection due ' + esc(res.next_inspection_date) : ''}.${status==='q' ? '<br><b>The asset has been marked as quarantined: do not use it until it is cleared.</b>' : ''}</div></div>`;
}
load();
</script>
</body>
</html>
